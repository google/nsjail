# Reproduces pasta failing to join the jail's namespaces when the jail runs
# as a different outside uid/gid, mapped with newuidmap/newgidmap:
#
#   [W] reapProc(): Pasta process <pid> exited unexpectedly with status 1. Killing the jail.
#
# pasta's own stderr, which nsjail does not show, says one of:
#
#   Couldn't open user namespace /proc/<pid>/ns/user: Permission denied
#   netns dir open: Permission denied, exiting
#
# 1. setresuid() to a different outside uid makes the child non-dumpable
#    until execve(), while pasta joins the child's namespaces asynchronously.
#    Fixed by the PR_SET_DUMPABLE call after setResUid() in user.cc.
# 2. /proc/<pid>/ns is then owned by the outside uid with mode 0511, so pasta
#    cannot open it to watch for the namespace going away.
#    Fixed by passing --no-netns-quit to pasta in net.cc.
#
# Requirements: newuidmap/newgidmap (Debian/Ubuntu package uidmap), and
# outside_id below must be a subordinate id of the current user in
# /etc/subuid and /etc/subgid.
#
# Run: nsjail --config nsjail.conf
# Control: with outside_id: "" (no uid change), the jail exits with status 0.

mode: ONCE

uidmap {
  outside_id: "100000"
  use_newidmap: true
}
gidmap {
  outside_id: "100000"
  use_newidmap: true
}

clone_newnet: true
user_net {
  backend: PASTA
  # Without a pasta block, nsjail does not start pasta.
  pasta {}
}

mount {
  src: "/"
  dst: "/"
  is_bind: true
}

exec_bin {
  path: "/bin/sleep"
  arg: "1"
}
