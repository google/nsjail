name: Validate nsjail TCP FIN fix

on:
  push:
    branches:
      - fix/nstun-tcp-fin-lifecycle-382
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and kafel submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential pkg-config protobuf-compiler libprotobuf-dev             libnl-route-3-dev libtool autoconf bison flex

      - name: Build nsjail
        run: make -j2

      - name: Build and run unit tests
        run: |
          make -j2 tests/nstun_buffer_budget_test tests/nstun_policy_test tests/nstun_ip_test tests/nstun_udp_peer_test
          ./tests/nstun_buffer_budget_test
          ./tests/nstun_policy_test
          ./tests/nstun_ip_test
          ./tests/nstun_udp_peer_test

      - name: Run TCP FIN regression test with ASan and UBSan
        run: python3 tests/nstun_tcp_fin_lifecycle_test.py
