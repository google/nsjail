# Regression test: a jail root that lives on a nosuid/nodev/noexec filesystem.
# /dev/shm is tmpfs,nosuid,nodev nearly everywhere; the directory is created by the
# test harness. The read-only pass over the jail root must keep the flags the root
# mount already carries, otherwise the kernel refuses to clear the locked ones.
name: "chroot-on-nosuid-filesystem"
description: "Jail root bind-mounted from a nosuid,nodev filesystem"

mode: ONCE
hostname: "NOSUIDROOT"
cwd: "/"

mount {
	src: "/dev/shm/nsjail_test_root"
	dst: "/"
	is_bind: true
}

mount { src: "/bin" dst: "/bin" is_bind: true }
mount { src: "/usr" dst: "/usr" is_bind: true }
mount { src: "/lib" dst: "/lib" is_bind: true mandatory: false }
mount { src: "/lib64" dst: "/lib64" is_bind: true mandatory: false }
mount { src: "/lib32" dst: "/lib32" is_bind: true mandatory: false }
