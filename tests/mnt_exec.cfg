# Control for tests/mnt_noexec.cfg: the same mount points, without noexec.
# An executable on /tmp/nx must run here, so a "denied" result in the noexec
# test means the flag was applied rather than the mount being broken.
name: "mnt-exec"
description: "Control for the noexec regression test"

mode: ONCE
hostname: "EXEC"
cwd: "/"

mount {
	src: "/"
	dst: "/"
	is_bind: true
}

mount {
	dst: "/tmp"
	fstype: "tmpfs"
	rw: true
}

mount {
	src: "/usr/bin"
	dst: "/tmp/nx"
	is_bind: true
	rw: true
}
