name: "nstun-listen-lifecycle"
mode: LISTEN
bindhost: "127.0.0.1"
port: 38080
max_conns: 1
hostname: "nstun-listen-lifecycle"

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true

uidmap {
	inside_id: "0"
	outside_id: ""
	count: 1
}

gidmap {
	inside_id: "0"
	outside_id: ""
	count: 1
}

mount_proc: true

mount {
	src: "/"
	dst: "/"
	is_bind: true
	nosuid: true
	nodev: false
	noexec: false
}

user_net {
	backend: NSTUN
}

exec_bin {
	path: "/bin/sh"
	arg: "-c"
	arg: "sleep 0.1"
}
