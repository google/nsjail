# Regression test: a bind mount carrying noexec must be established *and* enforced,
# including when the jail root is itself a mount point (--chroot / equivalent).
name: "mnt-noexec"
description: "A noexec bind mount at a plain-directory destination is enforced"

mode: ONCE
hostname: "NOEXEC"
cwd: "/"

mount {
	src: "/"
	dst: "/"
	is_bind: true
}

mount {
	dst: "/tmp"
	fstype: "tmpfs"
	rw: true
}

mount {
	src: "/usr/bin"
	dst: "/tmp/nx"
	is_bind: true
	rw: true
	noexec: true
}
