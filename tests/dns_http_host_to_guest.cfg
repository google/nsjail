name: "dns_http_host_to_guest"
description: "Test for HOST_TO_GUEST proxy redirection."

mode: ONCE
time_limit: 30
envar: "PATH=/usr/bin:/bin:/usr/sbin:/sbin"
keep_caps: true

mount {
	src: "/"
	dst: "/"
	is_bind: true
}

user_net {
	rule4 {
		direction: HOST_TO_GUEST
		action: REDIRECT
		proto: UDP
		dport: 53535
		redirect_port: 53535
	}
	# An explicit broad ALLOW must not widen the selective UDP listener.
	rule4 {
		direction: HOST_TO_GUEST
		action: ALLOW
		proto: UDP
		dport: 53536
	}
	rule4 {
		direction: HOST_TO_GUEST
		action: REDIRECT
		proto: UDP
		dst_ip: "127.0.0.1"
		dport: 53536
		redirect_port: 53535
	}
	rule4 {
		direction: HOST_TO_GUEST
		action: REDIRECT
		proto: TCP
		dport: 8080
		redirect_port: 8000
	}
	# An explicit broad ALLOW must not widen the selective REDIRECT listener.
	rule4 {
		direction: HOST_TO_GUEST
		action: ALLOW
		proto: TCP
		dport: 8081
	}
	rule4 {
		direction: HOST_TO_GUEST
		action: REDIRECT
		proto: TCP
		dst_ip: "127.0.0.1"
		dport: 8081
		redirect_port: 8000
	}
	rule6 {
		direction: HOST_TO_GUEST
		action: REDIRECT
		proto: TCP
		dport: 8080
		redirect_port: 8000
	}
	# Apply the same selector-isolation checks to IPv6 TCP and UDP.
	rule6 {
		direction: HOST_TO_GUEST
		action: ALLOW
		proto: TCP
		dport: 8081
	}
	rule6 {
		direction: HOST_TO_GUEST
		action: REDIRECT
		proto: TCP
		dst_ip: "::1"
		dport: 8081
		redirect_port: 8000
	}
	rule6 {
		direction: HOST_TO_GUEST
		action: ALLOW
		proto: UDP
		dport: 53536
	}
	rule6 {
		direction: HOST_TO_GUEST
		action: REDIRECT
		proto: UDP
		dst_ip: "::1"
		dport: 53536
		redirect_port: 53535
	}
}

exec_bin {
	path: "/usr/bin/python3"
	arg: "tests/nstun_host_to_guest_server.py"
}
