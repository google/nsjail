name: "mnt-dst-symlink-escape"
description: "A symlink planted at the final destination component must not be followed"
mode: ONCE
mount: {
  is_symlink: true
  src: "/tmp/nsjail-mnt-containment-test/dst_dir/pwned"
  dst: "/escfile"
  rw: true
  mandatory: false
}
mount: {
  is_bind: true
  src: "/tmp/nsjail-mnt-containment-test/bind_file"
  dst: "/escfile"
  rw: true
  mandatory: false
}
mount: {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: true
}
mount: {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: true
}
